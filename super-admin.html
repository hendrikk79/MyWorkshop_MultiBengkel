<!DOCTYPE html><html lang="id"><head><link rel="icon" type="image/png" href="favicon.png"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>MyWorkshop</title><link rel="stylesheet" href="style.css"><style>
.sa-action-btn{background:#2563eb !important;border:1px solid #2563eb !important;color:#fff !important;border-radius:6px;padding:8px 14px;font-weight:700;cursor:pointer}
.sa-action-btn:hover{background:#1d4ed8 !important;border-color:#1d4ed8 !important}
#form>button[type="submit"]{background:#2563eb;border:1px solid #2563eb;color:#fff;border-radius:6px;padding:9px 16px;font-weight:700;cursor:pointer}
#form>button[type="submit"]:hover{background:#1d4ed8;border-color:#1d4ed8}
</style>
</head><body><div class="app"><div id="sidebar-container"></div><main class="main"><header class="topbar"><button class="sidebar-toggle" onclick="toggleSidebar()">☰</button><div class="topbar-title"><div class="page-title">Management Bengkel</div><div class="page-description">Pengelolaan bengkel-bengkel MyWorkshop oleh Super Admin</div></div></header><section class="content"><div id="notice"></div><div style="background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:20px;margin-bottom:18px"><details open><summary style="cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;font-size:20px;font-weight:700;margin-bottom:16px"><span>Buat Bengkel</span><span aria-hidden="true">▼</span></summary><form id="form" style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><input name="name" placeholder="Nama Bengkel" required><input name="document_code" placeholder="Kode Identitas Dokumen (unik)" maxlength="20" required><input name="phone" placeholder="Telepon"><input name="email" type="email" placeholder="Email"><input name="address" placeholder="Alamat"><input name="notes" placeholder="Catatan"><label style="grid-column:1/-1;display:flex;flex-direction:column;gap:6px;font-weight:600">Logo Bengkel<input name="logo_file" type="file" accept="image/png,image/jpeg,image/webp"></label><input name="manager_full_name" placeholder="Nama Manager Master" required><input name="manager_username" placeholder="Username Manager Master" required><input name="manager_password" type="password" placeholder="Password Manager Master (min. 6)" required><button type="submit">BUAT BENGKEL</button></form></details></div><div style="background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:20px"><h2 style="margin-top:0">Daftar Bengkel</h2><div style="margin-bottom:12px"><input id="workshopSearch" type="search" placeholder="Cari nama bengkel..." style="width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #d1d5db;border-radius:8px"></div><div style="overflow:auto"><table style="width:100%;border-collapse:collapse"><thead><tr><th>Kode</th><th>Kode Dokumen</th><th>Logo</th><th>Nama Bengkel</th><th>Telepon</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="rows"></tbody></table></div></div></section></main></div><script src="layout.js"></script><script src="super-admin.js"></script></body></html>
